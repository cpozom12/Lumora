name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, agent/security-hardening ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

  lint:
    needs: validate-wrapper
    runs-on: ubuntu-latest
    env:
      # Differential lint always compares against the pull request's actual base branch.
      BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}
    steps:
      - name: Check out baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.BASE_REF }}
          path: baseline
          persist-credentials: false
      - name: Check out candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: candidate
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Enable temporary lint baseline on base
        working-directory: baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          marker = 'android {\n'
          if marker not in s:
              raise SystemExit('android block not found')
          s = s.replace(marker, 'android {\n    lint {\n        baseline = file("lint-baseline.xml")\n    }\n\n', 1)
          p.write_text(s)
          PY
      - name: Generate lint baseline from current base
        working-directory: baseline
        run: ./gradlew :app:updateLintBaseline --no-daemon
      - name: Enable lint baseline on candidate
        working-directory: candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          marker = 'android {\n'
          if marker not in s:
              raise SystemExit('android block not found')
          s = s.replace(marker, 'android {\n    lint {\n        baseline = file("lint-baseline.xml")\n    }\n\n', 1)
          p.write_text(s)
          PY
          cp ../baseline/app/lint-baseline.xml app/lint-baseline.xml
      - name: Run differential lint
        working-directory: candidate
        run: ./gradlew :app:lintDebug --no-daemon

  build:
    needs: validate-wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  security-gate:
    needs: validate-wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Check source security invariants
        run: python3 tools/security_gate.py
      - name: Build hardened debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Scan built APK
        run: python3 tools/security_gate.py --apk app/build/outputs/apk/debug/app-debug.apk

  test:
    needs: validate-wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Run tests
        run: ./gradlew test --no-daemon
