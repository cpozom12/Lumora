name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

  lint:
    needs: validate-wrapper
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}
    steps:
      - name: Check out baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.BASE_REF }}
          path: baseline
          persist-credentials: false
      - name: Check out candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: candidate
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Enable temporary lint baseline on base
        working-directory: baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          marker = 'android {\n'
          if marker not in s:
              raise SystemExit('android block not found')
          s = s.replace(marker, 'android {\n    lint {\n        baseline = file("lint-baseline.xml")\n    }\n\n', 1)
          p.write_text(s)
          PY
      - name: Generate lint baseline from current base
        working-directory: baseline
        run: ./gradlew :app:updateLintBaseline --no-daemon
      - name: Enable lint baseline on candidate
        working-directory: candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          marker = 'android {\n'
          if marker not in s:
              raise SystemExit('android block not found')
          s = s.replace(marker, 'android {\n    lint {\n        baseline = file("lint-baseline.xml")\n    }\n\n', 1)
          p.write_text(s)
          PY
          cp ../baseline/app/lint-baseline.xml app/lint-baseline.xml
      - name: Run differential lint
        working-directory: candidate
        run: ./gradlew :app:lintDebug --no-daemon

  build:
    needs: validate-wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  test:
    needs: validate-wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Build QuickJS desktop native library
        run: |
          git clone --recursive https://github.com/HarlonWang/quickjs-wrapper.git quickjs-wrapper
          git -C quickjs-wrapper checkout cfdc05fa11ac866558297e888fbac5580905e194
          git -C quickjs-wrapper submodule update --init --recursive
          cmake -DCMAKE_BUILD_TYPE=Debug -DCMAKE_MAKE_PROGRAM=ninja -G Ninja \
            -S quickjs-wrapper/wrapper-java/src/main \
            -B quickjs-wrapper/wrapper-java/build/cmake
          cmake --build quickjs-wrapper/wrapper-java/build/cmake \
            --target quickjs-java-wrapper -j 4
      - name: Run tests
        run: >-
          ./gradlew test --no-daemon
          -Dtest.quickjs.so=${{ github.workspace }}/quickjs-wrapper/wrapper-java/build/cmake/libquickjs-java-wrapper.so
